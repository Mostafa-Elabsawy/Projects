<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEAN Stack Task1</title>
    <link rel="stylesheet" href="Css/bootstrap.min.css" />
    <link rel="stylesheet" href="Css/main.css" />
  </head>

  <body class="container pt-4">
    <div action="" class="w-75 m-auto p-5 shadow rounded" style="background-color: #e7e5e5;">
      <h1 class="text-primary text-center d-block" id="title1">CRUD System</h1>

      <div class="mb-3">
        <label class="">Name</label>
        <input type="text" class="form-control" id="Name" />
      </div>
      <div class="mb-3">
        <label class="">Price</label>
        <input type="text" class="form-control" id="Price" />
      </div>
      <div class="mb-3">
        <label class="">Category</label>
        <input type="text" class="form-control" id="Category" />
      </div>
      <div class="mb-3">
        <label class="">Description</label>
        <textarea id="Description" class="form-control"></textarea>
      </div>

      <button class="btn w-50 bg-primary m-auto text-white fw-medium fs-5" id="button_add">
        Add product
      </button>
      <button class="btn w-50 bg-warning m-auto text-white fw-medium fs-5"id="button_update" >
        Update product
      </button>

      <form class="d-flex mt-5" role="search">
        <input class="form-control me-2 " type="search" placeholder="Search" id="Search"/>
        <button class="btn btn-outline-primary" id="button_search">Search</button>
      </form>
      
      <table class="table border-primary table-striped table-light mt-3">
        <thead class="table-active table-secondary">
          <tr class="fs-5 fw-medium">
            <th class="text-primary">Product</th>
            <th class="text-primary">Price</th>
            <th class="text-primary">Catoegry</th>
            <th class="text-primary">Describtion</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody
          id="table_body"
          class="fs-6 fw-semibold text-capitalize table-group-divider"
        ></tbody>
      </table>
    </div>

    <scrip src="bootstrap.bundle.min.js"></scrip>
    <script src="java_script/main.js"></script>
  </body>
</html>
